databases:
  - name: freshcart-db
    databaseName: freshcart
    user: freshcart_user
    plan: free

services:
  # Backend Web Service
  - type: web
    name: freshcart-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: freshcart-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

  # Storefront Static Site
  - type: web
    name: freshcart-storefront
    env: static
    plan: free
    rootDir: storefront
    buildCommand: npm install && npm run build
    publishDir: out
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: freshcart-backend
          property: host

  # Admin Panel Static Site
  - type: web
    name: freshcart-admin
    env: static
    plan: free
    rootDir: admin
    buildCommand: npm install && npm run build
    publishDir: out
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: freshcart-backend
          property: host
